<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Traveler's Coffee</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      width:100%;
      height:100vh;
      overflow:hidden;
      font-family: Georgia, serif;
      background:#f4eadb;
      position:relative;
    }

    .bg{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      object-fit:cover;
    }

    .overlay{
      position:absolute;
      inset:0;
      display:flex;
      justify-content:center;
      align-items:center;
      gap:40px;
      padding:20px;
    }

    .btn{
      width:420px;
      height:220px;
      border-radius:32px;
      border:4px solid #d7b26d;
      color:#f6d690;
      font-size:58px;
      font-weight:bold;
      cursor:pointer;
      transition:0.25s;
      box-shadow:0 15px 40px rgba(0,0,0,0.25);
      text-decoration:none;

      display:flex;
      align-items:center;
      justify-content:center;
    }

    .btn:hover{
      transform:scale(1.04);
    }

    .menu{
      background:linear-gradient(135deg,#0f4b36,#123d2e);
    }

    .lunch{
      background:linear-gradient(135deg,#5b0f17,#6d121d);
    }

    @media (max-width: 900px){

      .overlay{
        flex-direction:column;
      }

      .btn{
        width:90%;
        max-width:500px;
        height:180px;
        font-size:42px;
      }
    }
  </style>
</head>
<body>

  <!-- Фоновая картинка -->
  <!-- Замени background.jpg на свою картинку -->
  <img src="background.png" class="bg">

  <div class="overlay">

    <!-- КНОПКА МЕНЮ -->
    <!-- ВСТАВЬ СВОЮ ССЫЛКУ -->
    <a href="https://travelers-coffee.uz/?utm_source=ig&utm_medium=social&utm_content=link_in_bio&fbclid=PAb21jcARo1VhleHRuA2FlbQIxMQBzcnRjBmFwcF9pZA81NjcwNjczNDMzNTI0MjcAAafBz3ID_qCuFAVWLZXgbE7wMsYIXl61zdHBZcdJVlBDFfY_Byw0svPYU7OtNA_aem_tQplmr7s8phfBHb5Br-z2Q"
       class="btn menu">
       МЕНЮ
    </a>

    <!-- КНОПКА БИЗНЕС ЛАНЧ -->
    <!-- ВСТАВЬ СВОЮ ССЫЛКУ -->
    <a href="https://begdiar.github.io/lunch1/"
       class="btn lunch">
       БИЗНЕС-ЛАНЧ
    </a>

  </div>

</body>
</html>
